<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Vera Clemson — Weekly P&L</title>
<style>
  :root{
    --app-bg:#242422;
    --card-bg:#b3b2ac;
    --card-border:#000000;
    --text:#000000;
    --white:#ffffff;
    --muted:#5a5a56;
    --report-muted:#3a3a38;
    --divider:#8f8e88;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#151514;
    display:flex;
    justify-content:center;
    padding:24px 12px;
    min-height:100vh;
  }
  .phone{width:420px;max-width:100%;}
  .app{background:var(--app-bg);border-radius:16px;padding:14px;}

  .topbar{
    background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:8px;
    padding:9px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;color:var(--text);font-size:13px;
  }
  .topbar.static{cursor:default;}
  .topbar .back{display:flex;align-items:center;gap:6px;font-size:14px;}

  .net-card{
    background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:8px;
    padding:10px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
  }
  .net-card .label{font-size:13px;color:var(--text);}
  .net-card .value{font-size:20px;font-weight:600;color:var(--text);}

  .cat-list{display:flex;flex-direction:column;gap:6px;}
  .cat-card{background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:8px;overflow:hidden;}
  .cat-header{
    padding:9px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .cat-header .name{font-size:14px;color:var(--text);}
  .cat-header .right{display:flex;align-items:center;gap:8px;}
  .cat-header .total{font-size:14px;color:var(--text);}
  .cat-header .chev{font-size:13px;color:var(--text);width:14px;text-align:center;}

  .cat-items{padding:0 12px 8px;display:flex;flex-direction:column;gap:5px;border-top:1.5px solid var(--card-border);}
  .cat-items.collapsed{display:none;}
  .line-item{display:flex;align-items:center;gap:6px;padding-top:6px;}
  .sign-btn{
    width:22px;height:22px;flex-shrink:0;border:1px solid var(--card-border);border-radius:5px;
    background:#a6a59f;color:var(--text);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;
  }
  .name-input,.amount-input{
    background:#ffffff;border:1.5px solid var(--card-border);border-radius:5px;
    font-size:13px;color:#000;padding:6px 8px;
  }
  .name-input{flex:1;min-width:0;}
  .name-input::placeholder,.amount-input::placeholder{color:#9a9a96;font-style:italic;}
  .amount-input{width:80px;text-align:right;}
  .remove-btn{
    width:22px;height:22px;flex-shrink:0;border:none;background:transparent;color:var(--text);
    font-size:15px;cursor:pointer;padding:0;
  }
  .add-line-btn{
    width:100%;margin-top:6px;padding:6px;font-size:12px;background:transparent;
    border:1px dashed var(--card-border);border-radius:5px;color:var(--text);cursor:pointer;
  }

  .actions{display:flex;gap:8px;margin-top:10px;}
  .btn{flex:1;padding:9px;border-radius:8px;font-size:13px;cursor:pointer;border:1.5px solid var(--card-border);}
  .btn-primary{background:#000;color:#fff;}
  .btn-secondary{background:#fff;color:#000;}

  /* Past weeks screen */
  .week-row{
    background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:8px;
    padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:6px;
  }
  .week-row .label{font-size:14px;color:var(--text);}
  .week-row .sub{font-size:11px;color:var(--report-muted);}
  .week-row .right{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);}

  /* Report screen */
  .report-card{background:#fff;border:1.5px solid var(--card-border);border-radius:8px;padding:20px;}
  .report-head{border-bottom:3px solid var(--card-bg);padding-bottom:10px;margin-bottom:14px;}
  .report-head .title{font-size:17px;font-weight:600;color:#000;}
  .report-head .sub{font-size:12px;color:var(--muted);}
  .report-net{text-align:center;margin-bottom:18px;}
  .report-net .label{font-size:12px;color:var(--muted);}
  .report-net .value{font-size:28px;font-weight:600;color:#000;}
  .report-net .explain{font-size:13px;color:var(--report-muted);margin-top:4px;}
  .report-line{margin-bottom:14px;}
  .report-line .row{display:flex;justify-content:space-between;font-size:14px;color:#000;font-weight:600;}
  .report-line .explain{font-size:13px;color:var(--report-muted);margin-top:2px;}
  .report-footer{border-top:1px solid #d8d7d0;margin-top:16px;padding-top:10px;font-size:11px;color:#8a8a86;text-align:center;}
  .report-actions{display:flex;gap:8px;margin-top:12px;}

  @media print{
    body *{visibility:hidden;}
    #report-print, #report-print *{visibility:visible;}
    #report-print{position:absolute;top:0;left:0;width:100%;border:none;padding:0;}
    body{background:#fff;padding:0;}
    .no-print{display:none !important;}
  }
</style>
</head>
<body>
<div class="phone"><div id="app" class="app"></div></div>

<script>
/* ---------- Config ---------- */
const BRAND = {
  consultingName: 'Lozano Restaurant Consulting',
  clientName: 'La Vera Clemson'
};

const CATEGORY_DEFS = [
  { id:'revenue', label:'Revenue', defaultSign:1 },
  { id:'cogs', label:'COGS', defaultSign:-1 },
  { id:'labor', label:'Labor', defaultSign:-1 },
  { id:'opex', label:'Operating expenses', defaultSign:-1 }
];

/* ---------- Demo state ---------- */
let idCounter = 1;
function nextId(){ return 'item' + (idCounter++); }

function makeItem(name, amount, sign){
  return { id: nextId(), name, amount, sign };
}

let state = {
  view: 'dashboard', // 'dashboard' | 'pastWeeks' | 'report'
  expanded: { revenue:false, cogs:false, labor:false, opex:false },
  currentWeekId: 'w1',
  weeks: [
    {
      id:'w1', label:'Sep 8–14', saved:false,
      items:{
        revenue:[ makeItem('Food sales',15800,1), makeItem('Beverage sales',2700,1) ],
        cogs:[ makeItem('Food purchases',5300,-1), makeItem('Beverage purchases',900,-1) ],
        labor:[ makeItem('Hourly wages',5200,-1), makeItem('Payroll taxes',700,-1) ],
        opex:[ makeItem('Electric bill',740,-1), makeItem('Water bill',310,-1), makeItem('Third-party vendor',1070,-1) ]
      }
    },
    {
      id:'w2', label:'Sep 1–7', saved:true,
      items:{
        revenue:[ makeItem('Food sales',14700,1), makeItem('Beverage sales',2500,1) ],
        cogs:[ makeItem('Food purchases',5000,-1), makeItem('Beverage purchases',800,-1) ],
        labor:[ makeItem('Hourly wages',4900,-1), makeItem('Payroll taxes',700,-1) ],
        opex:[ makeItem('Electric bill',700,-1), makeItem('Water bill',290,-1), makeItem('Third-party vendor',900,-1) ]
      }
    },
    {
      id:'w3', label:'Aug 25–31', saved:true,
      items:{
        revenue:[ makeItem('Food sales',10300,1), makeItem('Beverage sales',1800,1) ],
        cogs:[ makeItem('Food purchases',4500,-1), makeItem('Beverage purchases',700,-1) ],
        labor:[ makeItem('Hourly wages',4700,-1), makeItem('Payroll taxes',600,-1) ],
        opex:[ makeItem('Electric bill',760,-1), makeItem('Water bill',320,-1), makeItem('Third-party vendor',1130,-1) ]
      }
    },
    {
      id:'w4', label:'Aug 18–24', saved:true,
      items:{
        revenue:[ makeItem('Food sales',12600,1), makeItem('Beverage sales',2200,1) ],
        cogs:[ makeItem('Food purchases',4400,-1), makeItem('Beverage purchases',700,-1) ],
        labor:[ makeItem('Hourly wages',4400,-1), makeItem('Payroll taxes',600,-1) ],
        opex:[ makeItem('Electric bill',780,-1), makeItem('Water bill',330,-1), makeItem('Third-party vendor',1250,-1) ]
      }
    }
  ]
};

/* ---------- Helpers ---------- */
function getCurrentWeek(){
  return state.weeks.find(w => w.id === state.currentWeekId);
}
function formatMoney(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function categoryTotal(week, catId){
  return week.items[catId].reduce((sum, it) => sum + it.sign * (parseFloat(it.amount) || 0), 0);
}
function netTotal(week){
  return CATEGORY_DEFS.reduce((sum, c) => sum + categoryTotal(week, c.id), 0);
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- Screens ---------- */
function dashboardScreen(){
  const week = getCurrentWeek();
  const net = netTotal(week);

  const catHtml = CATEGORY_DEFS.map(cat => {
    const total = categoryTotal(week, cat.id);
    const items = week.items[cat.id];
    const expanded = state.expanded[cat.id];
    const itemsHtml = items.map(it => `
      <div class="line-item">
        <button class="sign-btn" onclick="toggleItemSign('${cat.id}','${it.id}')">${it.sign > 0 ? '+' : '&minus;'}</button>
        <input class="name-input" type="text" placeholder="e.g. Electric bill" value="${escapeHtml(it.name)}"
          oninput="updateItemName('${cat.id}','${it.id}', this.value)">
        <input class="amount-input" type="number" step="0.01" placeholder="0.00" value="${it.amount || ''}"
          oninput="updateItemAmount('${cat.id}','${it.id}', this.value)">
        <button class="remove-btn" onclick="removeLineItem('${cat.id}','${it.id}')" title="Remove">&times;</button>
      </div>`).join('');

    return `
      <div class="cat-card">
        <div class="cat-header" onclick="toggleCategory('${cat.id}')">
          <span class="name">${cat.label}</span>
          <div class="right">
            <span class="total" id="cat-total-${cat.id}">${formatMoney(total)}</span>
            <span class="chev">${expanded ? '&#9652;' : '&#9662;'}</span>
          </div>
        </div>
        <div class="cat-items ${expanded ? '' : 'collapsed'}" id="cat-items-${cat.id}">
          ${itemsHtml}
          <button class="add-line-btn" onclick="addLineItem('${cat.id}')">+ Add line item</button>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="topbar" onclick="goTo('pastWeeks')">
      <span>Week of</span>
      <span class="back">${week.label} &rsaquo;</span>
    </div>
    <div class="net-card">
      <span class="label">Net profit / loss</span>
      <span class="value" id="net-total">${formatMoney(net)}</span>
    </div>
    <div class="cat-list">${catHtml}</div>
    <div class="actions">
      <button class="btn btn-primary" onclick="saveWeek()">${week.saved ? 'Saved' : 'Save week'}</button>
      <button class="btn btn-secondary" onclick="goTo('report')">Export PDF</button>
    </div>
  `;
}

function pastWeeksScreen(){
  const rows = state.weeks.map(w => {
    const isCurrent = w.id === state.currentWeekId;
    return `
      <div class="week-row" onclick="openWeek('${w.id}')">
        <div>
          <div class="label">${w.label}</div>
          ${isCurrent && !w.saved ? `<div class="sub">current, unsaved</div>` : ''}
        </div>
        <div class="right">
          <span>${formatMoney(netTotal(w))}</span>
          <span>&rsaquo;</span>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="topbar static">
      <span class="back" style="cursor:pointer" onclick="goTo('dashboard')">&lsaquo; Back</span>
      <span onclick="newWeek()" style="cursor:pointer;">+ New week</span>
    </div>
    ${rows}
  `;
}

function reportScreen(){
  const week = getCurrentWeek();
  const net = netTotal(week);
  const revenue = categoryTotal(week, 'revenue');
  const cogs = categoryTotal(week, 'cogs');
  const labor = categoryTotal(week, 'labor');
  const opex = categoryTotal(week, 'opex');
  const cogsPct = revenue > 0 ? Math.round((Math.abs(cogs) / revenue) * 100) : 0;

  return `
    <div class="topbar static no-print">
      <span class="back" style="cursor:pointer" onclick="goTo('dashboard')">&lsaquo; Back</span>
      <span></span>
    </div>
    <div class="report-card" id="report-print">
      <div class="report-head">
        <div class="title">Weekly P&amp;L &mdash; ${BRAND.clientName}</div>
        <div class="sub">Week of ${week.label}, 2026</div>
      </div>

      <div class="report-net">
        <div class="label">Net profit / loss</div>
        <div class="value">${formatMoney(net)}</div>
        <div class="explain">${net >= 0
          ? `The business made ${formatMoney(net)} more than it spent this week.`
          : `The business spent ${formatMoney(Math.abs(net))} more than it made this week.`}</div>
      </div>

      <div class="report-line">
        <div class="row"><span>Revenue</span><span>${formatMoney(revenue)}</span></div>
        <div class="explain">What ${BRAND.clientName} brought in this week — the number everything else is measured against.</div>
      </div>
      <div class="report-line">
        <div class="row"><span>COGS</span><span>${formatMoney(Math.abs(cogs))}</span></div>
        <div class="explain">What it cost to buy the food and drinks sold this week — ${cogsPct}% of revenue.</div>
      </div>
      <div class="report-line">
        <div class="row"><span>Labor</span><span>${formatMoney(Math.abs(labor))}</span></div>
        <div class="explain">What it cost to pay the team that ran the restaurant this week.</div>
      </div>
      <div class="report-line">
        <div class="row"><span>Operating expenses</span><span>${formatMoney(Math.abs(opex))}</span></div>
        <div class="explain">Everything else it took to keep the doors open — utilities, vendors, and similar bills.</div>
      </div>

      <div class="report-footer">Prepared by ${BRAND.consultingName}</div>
    </div>
    <div class="report-actions no-print">
      <button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>
    </div>
  `;
}

/* ---------- Render ---------- */
function render(){
  const app = document.getElementById('app');
  if (state.view === 'dashboard') app.innerHTML = dashboardScreen();
  else if (state.view === 'pastWeeks') app.innerHTML = pastWeeksScreen();
  else if (state.view === 'report') app.innerHTML = reportScreen();
}

/* ---------- Actions ---------- */
function goTo(view){ state.view = view; render(); }

function toggleCategory(catId){
  state.expanded[catId] = !state.expanded[catId];
  render();
}

function toggleItemSign(catId, itemId){
  const week = getCurrentWeek();
  const item = week.items[catId].find(it => it.id === itemId);
  item.sign *= -1;
  render();
}

function updateItemName(catId, itemId, value){
  const week = getCurrentWeek();
  const item = week.items[catId].find(it => it.id === itemId);
  item.name = value;
}

function updateItemAmount(catId, itemId, value){
  const week = getCurrentWeek();
  const item = week.items[catId].find(it => it.id === itemId);
  item.amount = parseFloat(value) || 0;
  updateTotals();
}

function updateTotals(){
  const week = getCurrentWeek();
  CATEGORY_DEFS.forEach(cat => {
    const el = document.getElementById('cat-total-' + cat.id);
    if (el) el.textContent = formatMoney(categoryTotal(week, cat.id));
  });
  const netEl = document.getElementById('net-total');
  if (netEl) netEl.textContent = formatMoney(netTotal(week));
}

function addLineItem(catId){
  const week = getCurrentWeek();
  const catDef = CATEGORY_DEFS.find(c => c.id === catId);
  week.items[catId].push(makeItem('', 0, catDef.defaultSign));
  state.expanded[catId] = true;
  render();
}

function removeLineItem(catId, itemId){
  const week = getCurrentWeek();
  week.items[catId] = week.items[catId].filter(it => it.id !== itemId);
  render();
}

function saveWeek(){
  const week = getCurrentWeek();
  week.saved = true;
  render();
}

function openWeek(weekId){
  state.currentWeekId = weekId;
  state.view = 'dashboard';
  render();
}

function newWeek(){
  const id = 'w' + (state.weeks.length + 1) + '_' + nextId();
  const blank = { revenue:[], cogs:[], labor:[], opex:[] };
  state.weeks.unshift({ id, label:'New week', saved:false, items:blank });
  state.currentWeekId = id;
  state.view = 'dashboard';
  render();
}

/* ---------- Init ---------- */
render();
</script>
</body>
</html>
